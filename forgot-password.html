<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Inkling</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-enhancements.css" />
</head>
<body class="auth-page">
  <main class="auth-screen auth-screen--page">
    <form id="forgot-form" class="auth-card panel-card">
      <h1 class="auth-card__title">Reset password</h1>
      <p class="auth-card__lead">Enter your email and we will send a reset link (expires in 30 minutes).</p>
      <label for="forgot-email">Email</label>
      <input type="email" id="forgot-email" required autocomplete="email" placeholder="you@example.com" />
      <p id="forgot-message" class="auth-sync-status" aria-live="polite"></p>
      <p id="forgot-error" class="auth-error hidden" role="alert"></p>
      <button type="submit" class="btn-primary btn-enter auth-submit">Send reset link</button>
      <p class="auth-hint"><a href="/login.html">← Back to sign in</a></p>
    </form>
  </main>
  <script type="module">
    import { apiFetch } from "./src/auth/cloudSync.js";

    document.getElementById("forgot-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgot-email")?.value?.trim().toLowerCase() ?? "";
      const errEl = document.getElementById("forgot-error");
      const msgEl = document.getElementById("forgot-message");
      errEl?.classList.add("hidden");
      msgEl.textContent = "Sending…";
      try {
        await apiFetch("/api/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email })
        });
        msgEl.textContent = "If that email is registered, check your inbox (or server console in dev).";
      } catch (err) {
        errEl.textContent = err.message || "Request failed.";
        errEl.classList.remove("hidden");
        msgEl.textContent = "";
      }
    });
  </script>
</body>
</html>
