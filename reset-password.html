<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New password — Inkling</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-enhancements.css" />
</head>
<body class="auth-page">
  <main class="auth-screen auth-screen--page">
    <form id="reset-form" class="auth-card panel-card">
      <h1 class="auth-card__title">Choose a new password</h1>
      <p id="reset-status" class="auth-card__lead">Checking reset link…</p>
      <label for="reset-password">New password</label>
      <input type="password" id="reset-password" minlength="6" required autocomplete="new-password" />
      <label for="reset-password2">Confirm password</label>
      <input type="password" id="reset-password2" minlength="6" required autocomplete="new-password" />
      <p id="reset-error" class="auth-error hidden" role="alert"></p>
      <button type="submit" id="reset-submit" class="btn-primary btn-enter auth-submit" disabled>Set password</button>
      <p class="auth-hint"><a href="/login.html">← Sign in</a></p>
    </form>
  </main>
  <script type="module">
    import { apiFetch } from "./src/auth/cloudSync.js";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const statusEl = document.getElementById("reset-status");
    const submitBtn = document.getElementById("reset-submit");
    const form = document.getElementById("reset-form");

    async function init() {
      if (!token) {
        statusEl.textContent = "Missing reset token. Request a new link.";
        return;
      }
      try {
        const { valid } = await apiFetch(`/api/auth/reset-token?token=${encodeURIComponent(token)}`);
        if (!valid) {
          statusEl.textContent = "This link is invalid or expired. Request a new one.";
          return;
        }
        statusEl.textContent = "Enter your new password below.";
        submitBtn.disabled = false;
      } catch {
        statusEl.textContent = "Could not verify link. Try again later.";
      }
    }

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const p1 = document.getElementById("reset-password")?.value ?? "";
      const p2 = document.getElementById("reset-password2")?.value ?? "";
      const errEl = document.getElementById("reset-error");
      if (p1.length < 6) {
        errEl.textContent = "Password must be at least 6 characters.";
        errEl.classList.remove("hidden");
        return;
      }
      if (p1 !== p2) {
        errEl.textContent = "Passwords do not match.";
        errEl.classList.remove("hidden");
        return;
      }
      submitBtn.disabled = true;
      try {
        await apiFetch("/api/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token, password: p1 })
        });
        window.location.href = "/login.html?reset=1";
      } catch (err) {
        errEl.textContent = err.message || "Reset failed.";
        errEl.classList.remove("hidden");
        submitBtn.disabled = false;
      }
    });

    void init();
  </script>
</body>
</html>
