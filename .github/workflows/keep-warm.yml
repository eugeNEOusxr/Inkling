name: keep-warm

# Pings the Render free-tier backend every ~14 minutes so it never sleeps —
# which is what makes login instant (no cold-start hang). Free for public repos.
# Ships to the Pages repo via build-web.mjs, so it runs from there on `main`.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend
        run: |
          curl -sS -m 90 -o /dev/null \
            -w "backend: HTTP %{http_code} in %{time_total}s\n" \
            https://inkling-15yf.onrender.com/ || true
